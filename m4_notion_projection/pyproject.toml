[project]
name = "grok-notion-projection"
version = "1.1.0"
description = "Notion-compatible projection adapter (M4)"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = [
  "error::pytest.PytestUnhandledThreadExceptionWarning",
]
