name: linux-offline

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  pytest-python312:
    name: Linux Python 3.12 offline pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install hashed wheels (acquisition)
        run: python -m pip install --no-index --require-hashes --find-links vendor/wheels -r requirements.lock
      - name: Run M1–M5 offline
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python run_all.py
      - name: Record host evidence
        if: always()
        run: |
          python - <<'PY'
          import os, platform, sys, hashlib, pathlib
          print("python", sys.version)
          print("platform", platform.platform())
          print("kernel", os.uname().release)
          print("commit", os.environ.get("GITHUB_SHA"))
          root = pathlib.Path("vendor/wheels")
          for p in sorted(root.glob("*.whl")):
              h = hashlib.sha256(p.read_bytes()).hexdigest()
              print(f"wheel {p.name} {h}")
          PY
          uname -a
      - name: Pack public linux-junit
        if: always()
        run: python scripts/pack_linux_evidence.py . linux-junit.zip
      - name: Upload JUnit and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-junit
          path: |
            artifacts/**
            linux-junit.zip
            **/REPORT.json
            **/junit.xml
      - name: Publish JUnit on GitHub Release (anonymous HTTPS)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          unzip -p linux-junit.zip linux-junit/linux-evidence.json > linux-evidence.json
          gh release upload "${GITHUB_REF_NAME}" linux-junit.zip linux-evidence.json --clobber

  docker-network-none:
    name: Pinned image, network-none tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build from pinned digest
        run: docker build -f m5_integration/Dockerfile -t contractor-accept:candidate .
      - name: Image digest
        run: docker image inspect contractor-accept:candidate --format '{{json .RepoDigests}} {{.Id}}'
      - name: Run tests with network disabled
        run: docker run --rm --network=none --env PYTHONDONTWRITEBYTECODE=1 --env PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 --env LINUX_DOCKER_VERIFIED=1 contractor-accept:candidate
